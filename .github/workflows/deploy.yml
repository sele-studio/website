name: Deploy to GitHub Pages

# Every push to main is checked (tools/check.mjs, strict gate) and, only if it passes, published.
# The published folder is _site/: the repo minus tools, data, partials, docs and git metadata.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint gate (tools/check.mjs)
        # Strict mode. Switch to `node tools/check.mjs --launch` once the owner has answered SPEC §11 items 1–4.
        run: node tools/check.mjs

      - name: Guard — generated files present
        run: test -f en/index.html && test -f sitemap.xml && test -f llms.txt && test -f favicon.ico && test -f CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'tools' --exclude 'data' --exclude 'partials' \
            --exclude 'README.md' --exclude '_site' --exclude 'node_modules' --exclude '.gitignore' --exclude '.DS_Store' --exclude '.htmlvalidate.mjs' \
            --exclude '.htmlvalidate.mjs' \
            ./ _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
